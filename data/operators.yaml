# Operators -> purchase-menu badges ("operator/<id>"). Add operators as their vehicles arrive.
# grf_id_block: first of the 100 vehicle grf_ids reserved for the operator (`pk new` picks the
# next free one). Blocks never move: saved games depend on the ids (data/ids.lock).
